
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          test -d "Youtube_Phantom_clone.xcodeproj"
          xcodebuild -version
      
      - name: Inspect Swift package files
        run: |
          echo "=== Swift package manifests ==="
          find . -name Package.swift -not -path '*/.git/*' -print

          echo "=== Resolved package files ==="
          find . -name Package.resolved -not -path '*/.git/*' -print

          echo "=== Xcode project package references ==="
          grep -nE 'XCRemoteSwiftPackageReference|repositoryURL|packageProductDependencies' \
            Youtube_Phantom_clone.xcodeproj/project.pbxproj || true


      
      - name: List Xcode schemes
        continue-on-error: true
        run: |
          xcodebuild -list \
            -project "Youtube_Phantom_clone.xcodeproj"

      
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project "Youtube_Phantom_clone.xcodeproj" \
            -target "Youtube_Phantom_clone" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build


      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Youtube_Phantom_clone.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Youtube-Phantom-Clone.ipa"
          test -f "$GITHUB_WORKSPACE/Youtube-Phantom-Clone.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youtube-Phantom-Clone-unsigned-IPA
          path: Youtube-Phantom-Clone.ipa
          if-no-files-found: error
          retention-days: 7

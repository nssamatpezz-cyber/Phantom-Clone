name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euxo pipefail
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      - name: Verify project
        run: |
          set -euxo pipefail
          test -d "Youtube_Phantom_clone.xcodeproj"
          test -f "Youtube_Phantom_clone.xcodeproj/project.pbxproj"
          ls -la

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "Youtube_Phantom_clone.xcodeproj" \
            -target "Youtube_Phantom_clone" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Youtube_Phantom_clone.app"
          IPA="$GITHUB_WORKSPACE/Youtube-Phantom-Clone-unsigned.ipa"

          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"

          test -f "$IPA"
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youtube-Phantom-Clone-unsigned-IPA
          path: Youtube-Phantom-Clone-unsigned.ipa
          if-no-files-found: error
          retention-days: 7


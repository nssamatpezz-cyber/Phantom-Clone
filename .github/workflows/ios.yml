name: Diagnose iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project syntax and package URL
        run: |
          set -euxo pipefail

          echo "=== Project file syntax ==="
          plutil -lint Youtube_Phantom_clone.xcodeproj/project.pbxproj

          echo "=== Exact package reference ==="
          sed -n '335,355p' Youtube_Phantom_clone.xcodeproj/project.pbxproj

          echo "=== Package lock file syntax ==="
          plutil -lint -s -r \
            Youtube_Phantom_clone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            || python3 -m json.tool \
            Youtube_Phantom_clone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          echo "=== Package reference occurrences ==="
          grep -n 'repositoryURL' Youtube_Phantom_clone.xcodeproj/project.pbxproj


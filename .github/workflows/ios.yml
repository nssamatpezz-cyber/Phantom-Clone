name: Diagnose iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kingfisher URL
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json

          project_path = Path(
              "Youtube_Phantom_clone.xcodeproj/project.pbxproj"
          )
          resolved_path = Path(
              "Youtube_Phantom_clone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          )

          project = project_path.read_text()
          resolved = json.loads(resolved_path.read_text())

          print("=== Project format ===")
          for line in project.splitlines():
              if "objectVersion" in line:
                  print(line.strip())

          print("=== URL in project.pbxproj ===")
          for line in project.splitlines():
              if "repositoryURL" in line:
                  print(repr(line.strip()))

          print("=== URL in Package.resolved ===")
          for pin in resolved.get("pins", []):
              if pin.get("identity") == "kingfisher":
                  print(repr(pin.get("location")))
                  print("Version:", pin.get("state", {}).get("version"))
                  print("Revision:", pin.get("state", {}).get("revision"))

          print("=== Project syntax ===")
          import subprocess
          subprocess.run(
              ["plutil", "-lint", str(project_path)],
              check=True
          )

          print("=== Package.resolved JSON ===")
          print("Valid JSON")
          PY

      - name: Show commit
        run: |
          git log -1 --oneline
          git status --short

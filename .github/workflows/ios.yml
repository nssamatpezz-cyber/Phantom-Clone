```yaml
name: Diagnose iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect project configuration
        run: |
          set -euxo pipefail

          echo "=== Commit ==="
          git log -1 --oneline

          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version

          echo "=== Project format ==="
          grep -n -E 'objectVersion|preferredProjectObjectVersion|minimizedProjectReferenceProxies' \
            Youtube_Phantom_clone.xcodeproj/project.pbxproj || true

          echo "=== Package references ==="
          grep -n -E 'XCRemoteSwiftPackageReference|XCSwiftPackageProductDependency|packageProductDependencies|repositoryURL|Kingfisher' \
            Youtube_Phantom_clone.xcodeproj/project.pbxproj || true

          echo "=== Package.resolved ==="
          cat "Youtube_Phantom_clone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          echo "=== Working tree ==="
          git status --short
```
